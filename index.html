<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Encryptor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Text Encryptor</h1>
    <div class="panels">
    <div class="enc">
        <h2>Encryption</h2>
        <form>
            <div>
                <input type="text" placeholder="Enter your text here" id="encrypt-input">
            </div>
            <div>
                <button type="button" id="encrypt-btn">Encrypt</button>
            </div>
            <div id="encrypt-result"></div>
        </form>
    </div>    
    <div class="divider"></div>
    <div class="denc">
        <h2>Decryption</h2>
        <form>
            <div>
                <input type="text" placeholder="Enter your text here" id="decrypt-input">
            </div>
            <div>
                <button type="button" id="decrypt-btn">Decrypt</button>
            </div>
            <div id="decrypt-result">

            </div>  
        </form>
    </div>          
    </div>
        
   </div>
   <script src="script.js"></script>
</body>
</html>
